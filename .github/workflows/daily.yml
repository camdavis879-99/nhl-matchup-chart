name: Daily NHL matchup chart

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's chart data
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NHL_JSON_PATH: today.json
        run: python3 nhl_daily.py
      - name: Enrich NHL data (form, splits, goalie stats, full names)
        run: python3 enrich.py today.json $(TZ=America/Phoenix date +%F)
      - name: Fetch NFL week
        run: python3 nfl.py nfl.json
      - name: Render the page
        run: python3 render.py today.json dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
